<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>פרקים - Netflix Demo</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: rgba(0, 0, 0, 0.95);
      color: #fff;
      overflow: hidden;
    }
    .overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.9);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }
    .overlay-content {
      background: #181818;
      border-radius: 12px;
      width: 90%;
      max-width: 900px;
      max-height: 90vh;
      overflow-y: auto;
      padding: 32px;
      position: relative;
    }
    .close-btn {
      position: absolute;
      top: 16px;
      left: 16px;
      background: transparent;
      border: none;
      color: #fff;
      font-size: 32px;
      cursor: pointer;
      line-height: 1;
      width: 40px;
      height: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      transition: background 0.2s;
    }
    .close-btn:hover {
      background: rgba(255, 255, 255, 0.1);
    }
    .series-header {
      margin-bottom: 24px;
      padding-left: 50px;
    }
    .series-header h1 {
      font-size: 28px;
      margin-bottom: 8px;
    }
    .series-meta {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      font-size: 14px;
      color: #b3b3b3;
    }
    .series-meta span {
      background: rgba(255, 255, 255, 0.1);
      padding: 4px 12px;
      border-radius: 999px;
    }
    .season-selector {
      margin-bottom: 24px;
    }
    .season-selector label {
      display: block;
      margin-bottom: 8px;
      font-size: 16px;
      font-weight: bold;
    }
    .season-selector select {
      width: 100%;
      max-width: 300px;
      padding: 12px;
      font-size: 16px;
      border-radius: 6px;
      border: 1px solid rgba(255, 255, 255, 0.3);
      background: #2a2a2a;
      color: #fff;
      cursor: pointer;
    }
    .episodes-list {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .episode-item {
      background: #2a2a2a;
      border-radius: 8px;
      padding: 16px;
      display: flex;
      gap: 16px;
      align-items: center;
      border: 2px solid transparent;
      transition: border 0.2s, background 0.2s;
      cursor: pointer;
    }
    .episode-item:hover {
      background: #333;
      border-color: rgba(229, 9, 20, 0.5);
    }
    .episode-item.watched {
      opacity: 0.7;
    }
    .episode-number {
      font-size: 20px;
      font-weight: bold;
      min-width: 40px;
      text-align: center;
      color: #e50914;
    }
    .episode-info {
      flex: 1;
    }
    .episode-title {
      font-size: 18px;
      font-weight: bold;
      margin-bottom: 4px;
    }
    .episode-duration {
      font-size: 14px;
      color: #b3b3b3;
    }
    .episode-progress {
      font-size: 12px;
      color: #46d369;
      margin-top: 4px;
    }
    .episode-actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }
    .btn {
      padding: 10px 20px;
      border-radius: 6px;
      border: none;
      cursor: pointer;
      font-weight: bold;
      font-size: 14px;
      transition: transform 0.2s, opacity 0.2s;
    }
    .btn-primary {
      background: linear-gradient(135deg, #e50914, #b00610);
      color: #fff;
    }
    .btn-secondary {
      background: transparent;
      border: 1px solid rgba(255, 255, 255, 0.6);
      color: #fff;
    }
    .btn:hover {
      transform: translateY(-1px);
      opacity: 0.95;
    }
    .btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    .progress-bar {
      height: 4px;
      background: rgba(255, 255, 255, 0.2);
      border-radius: 2px;
      margin-top: 8px;
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      background: #e50914;
      border-radius: 2px;
      transition: width 0.3s;
    }
    .loading {
      text-align: center;
      padding: 40px;
      font-size: 18px;
      color: #b3b3b3;
    }
    .error-message {
      background: rgba(229, 9, 20, 0.15);
      border: 1px solid rgba(229, 9, 20, 0.4);
      color: #ff747d;
      padding: 16px;
      border-radius: 8px;
      margin: 20px 0;
    }
    .debug-info {
      background: #2a2a2a;
      border: 1px solid #444;
      padding: 16px;
      border-radius: 8px;
      margin: 20px 0;
      font-family: monospace;
      font-size: 12px;
      color: #b3b3b3;
    }
  </style>
</head>
<body>
  <div class="overlay">
    <div class="overlay-content">
      <button class="close-btn" id="closeBtn">×</button>
      
      <div class="series-header">
        <h1 id="seriesTitle">טוען...</h1>
        <div class="series-meta" id="seriesMeta"></div>
      </div>

      <div id="errorContainer"></div>
      <div id="debugInfo" class="debug-info" style="display:none;"></div>

      <div class="season-selector" id="seasonSelectorContainer" style="display:none;">
        <label for="seasonSelect">בחר עונה:</label>
        <select id="seasonSelect">
          <option value="">טוען...</option>
        </select>
      </div>

      <div id="loadingIndicator" class="loading">טוען פרקים...</div>
      <div class="episodes-list" id="episodesList"></div>
    </div>
  </div>

  <script>
    // Debug function to show what's happening
    function showDebug(message, data) {
      console.log(message, data);
      const debugDiv = document.getElementById('debugInfo');
      debugDiv.style.display = 'block';
      debugDiv.innerHTML += `<div><strong>${message}:</strong> ${JSON.stringify(data, null, 2)}</div>`;
    }

    function showError(message) {
      const errorContainer = document.getElementById('errorContainer');
      errorContainer.innerHTML = `<div class="error-message">${message}</div>`;
      document.getElementById('loadingIndicator').style.display = 'none';
    }

    const params = new URLSearchParams(window.location.search);
    const contentId = params.get('contentId');
    const userId = params.get('userId');
    
    showDebug('URL Parameters', { contentId, userId });

    const WATCH_HISTORY_BASE = 'http://localhost:5001/api/watchHistory';
    const CONTENT_BASE = 'http://localhost:5001/api/content';

    let seriesData = null;
    let episodeProgressMap = {};
    let currentEpisode = null;

    // Validation
    if (!contentId) {
      showError('שגיאה: לא נמצא מזהה תוכן. אנא חזור לדף הראשי ונסה שוב.');
      showDebug('Missing contentId', 'URL does not contain contentId parameter');
    }

    if (!userId) {
      showError('שגיאה: לא נמצא מזהה משתמש. אנא התחבר מחדש.');
      showDebug('Missing userId', 'URL does not contain userId parameter');
    }

    document.getElementById('closeBtn').addEventListener('click', () => {
      window.location.href = 'main-page.html';
    });

    async function loadSeriesData() {
      try {
        showDebug('Fetching series data', `${CONTENT_BASE}/${contentId}`);
        
        const response = await fetch(`${CONTENT_BASE}/${contentId}`);
        showDebug('Response status', response.status);
        
        if (!response.ok) {
          throw new Error(`שגיאת שרת: ${response.status}`);
        }
        
        seriesData = await response.json();
        showDebug('Series data loaded', seriesData);
        
        // Validation
        if (!seriesData) {
          throw new Error('לא התקבלו נתונים מהשרת');
        }

        if (seriesData.type !== 'series') {
          throw new Error('התוכן הזה אינו סדרה. סוג התוכן: ' + seriesData.type);
        }

        if (!seriesData.seasons || seriesData.seasons.length === 0) {
          throw new Error('לסדרה זו אין עונות מוגדרות במערכת');
        }
        
        document.getElementById('seriesTitle').textContent = seriesData.title;
        renderMetadata();
        populateSeasonSelector();
      } catch (error) {
        console.error('Error loading series:', error);
        showError(`שגיאה בטעינת הסדרה: ${error.message}`);
        showDebug('Error details', error);
      }
    }

    function renderMetadata() {
      const meta = [];
      if (seriesData.releaseYear) meta.push(`<span>${seriesData.releaseYear}</span>`);
      if (seriesData.genre && seriesData.genre.length) {
        meta.push(...seriesData.genre.slice(0, 3).map(g => `<span>${g}</span>`));
      }
      if (seriesData.rating && seriesData.rating !== -1) {
        meta.push(`<span>⭐ ${parseFloat(seriesData.rating).toFixed(1)}</span>`);
      }
      document.getElementById('seriesMeta').innerHTML = meta.join('');
    }

    function populateSeasonSelector() {
      const select = document.getElementById('seasonSelect');
      const container = document.getElementById('seasonSelectorContainer');
      select.innerHTML = '';
      
      showDebug('Populating seasons', seriesData.seasons);

      if (!seriesData.seasons || seriesData.seasons.length === 0) {
        select.innerHTML = '<option>אין עונות זמינות</option>';
        return;
      }

      seriesData.seasons.forEach(season => {
        const option = document.createElement('option');
        option.value = season.seasonNumber;
        option.textContent = `עונה ${season.seasonNumber} (${season.episodes?.length || 0} פרקים)`;
        select.appendChild(option);
      });

      container.style.display = 'block';

      select.addEventListener('change', () => {
        const seasonNum = parseInt(select.value);
        showDebug('Season selected', seasonNum);
        renderEpisodes(seasonNum);
      });

      // Load first season by default
      select.value = seriesData.seasons[0].seasonNumber;
      renderEpisodes(seriesData.seasons[0].seasonNumber);
    }

    async function loadEpisodeProgress() {
      try {
        showDebug('Loading episode progress', `${WATCH_HISTORY_BASE}/episode-progress/${userId}/${contentId}`);
        
        const response = await fetch(`${WATCH_HISTORY_BASE}/episode-progress/${userId}/${contentId}`);
        
        if (!response.ok) {
          console.warn('Failed to load progress, continuing without it');
          return;
        }
        
        const data = await response.json();
        showDebug('Episode progress loaded', data);
        
        episodeProgressMap = {};
        
        (data.episodeProgress || []).forEach(ep => {
          const key = `${ep.seasonNumber}-${ep.episodeNumber}`;
          episodeProgressMap[key] = {
            progress: ep.progress,
            completed: ep.completed
          };
        });

        currentEpisode = data.currentEpisode;
      } catch (error) {
        console.error('Error loading episode progress:', error);
        showDebug('Progress error (non-critical)', error.message);
        episodeProgressMap = {};
      }
    }

    async function renderEpisodes(seasonNumber) {
      document.getElementById('loadingIndicator').style.display = 'block';
      document.getElementById('episodesList').innerHTML = '';

      await loadEpisodeProgress();

      const season = seriesData.seasons.find(s => s.seasonNumber === seasonNumber);
      
      if (!season) {
        showError(`לא נמצאה עונה ${seasonNumber}`);
        return;
      }

      if (!season.episodes || season.episodes.length === 0) {
        document.getElementById('loadingIndicator').textContent = 'לא נמצאו פרקים בעונה זו';
        showDebug('No episodes', season);
        return;
      }

      showDebug('Rendering episodes', { season: seasonNumber, episodes: season.episodes });

      document.getElementById('loadingIndicator').style.display = 'none';
      const episodesList = document.getElementById('episodesList');

      season.episodes.forEach((episode, index) => {
        const key = `${seasonNumber}-${episode.episodeNumber}`;
        const progress = episodeProgressMap[key] || { progress: 0, completed: false };
        const progressPercent = episode.duration ? (progress.progress / episode.duration * 100) : 0;

        const episodeDiv = document.createElement('div');
        episodeDiv.classList.add('episode-item');
        if (progress.completed) {
          episodeDiv.classList.add('watched');
        }

        const hasPrevious = index > 0;
        const hasNext = index < season.episodes.length - 1;

        episodeDiv.innerHTML = `
          <div class="episode-number">${episode.episodeNumber}</div>
          <div class="episode-info">
            <div class="episode-title">${episode.title || `פרק ${episode.episodeNumber}`}</div>
            <div class="episode-duration">${formatDuration(episode.duration)}</div>
            ${progress.progress > 0 ? `
              <div class="episode-progress">נשמר בנקודת זמן ${formatPlaybackTime(progress.progress)}</div>
              <div class="progress-bar">
                <div class="progress-fill" style="width: ${progressPercent}%"></div>
              </div>
            ` : ''}
          </div>
          <div class="episode-actions">
            <button class="btn btn-primary" onclick="playEpisode(${seasonNumber}, ${episode.episodeNumber}, false)">
              ${progress.progress > 0 ? 'המשך צפייה' : 'התחל צפייה'}
            </button>
            ${progress.progress > 0 ? `
              <button class="btn btn-secondary" onclick="playEpisode(${seasonNumber}, ${episode.episodeNumber}, true)">
                התחל מהתחלה
              </button>
            ` : ''}
          </div>
        `;

        episodesList.appendChild(episodeDiv);
      });
    }

    function formatDuration(seconds) {
      if (!seconds) return 'לא ידוע';
      const mins = Math.floor(seconds / 60);
      return `${mins} דקות`;
    }

    function formatPlaybackTime(seconds) {
      const totalSeconds = Math.max(0, Math.floor(Number(seconds) || 0));
      const hours = Math.floor(totalSeconds / 3600);
      const minutes = Math.floor((totalSeconds % 3600) / 60);
      const secs = totalSeconds % 60;
      if (hours > 0) {
        return `${hours}:${String(minutes).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
      }
      return `${minutes}:${String(secs).padStart(2, '0')}`;
    }

    window.playEpisode = function(seasonNumber, episodeNumber, restart) {
      showDebug('Playing episode', { seasonNumber, episodeNumber, restart });
      const params = new URLSearchParams({
        contentId: contentId,
        seasonNumber: seasonNumber,
        episodeNumber: episodeNumber,
        restart: restart ? '1' : '0'
      });
      window.location.href = `watch.html?${params.toString()}`;
    };

    // Initialize only if we have required params
    if (contentId && userId) {
      loadSeriesData();
    }
  </script>
</body>
</html>
