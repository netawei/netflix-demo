<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>מי צופה?</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #000;
      color: #fff;
    }
    .center {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px;
    }
    h1 {
      margin-bottom: 30px;
      font-size: 35px;
    }
    .avatar-grid {
      display: flex;
      flex-direction: row;
      flex-wrap: nowrap;
      justify-content: center;
      align-items: flex-start;
      gap: 30px;
      width: 100%;
      max-width: 100%;
      margin-bottom: 30px;
      list-style: none;
      padding: 0;
      overflow-x: auto;
    }
    .avatar {
      text-align: center;
      color: #aaa;
      cursor: pointer;
      flex-shrink: 0;
    }
    .avatar img {
      width: 150px;
      height: 150px;
      object-fit: cover;
      border-radius: 10px;
      border: 2px solid transparent;
      transition: transform 0.5s, border 0.5s;
    }
    .avatar img:hover {
      transform: scale(1.1);
      border-color: #555;
    }
    .avatar p {
      margin-top: 10px;
      color: #fff;
      font-weight: bold;
      font-size: 17px;
    }
    .btn-outline {
      padding: 10px 20px;
      border: 1px solid #555;
      background: transparent;
      color: #fff;
      border-radius: 999px;
      cursor: pointer;
      font-size: 17px;
    }
    .btn-outline:hover {
      background: #222;
    }
    .avatar.add-profile {
      flex-shrink: 0;
      width: 150px;
    }
    .avatar.add-profile .add-button-content {
      width: 150px;
      height: 150px;
      border: 2px dashed #555;
      border-radius: 10px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      transition: border-color 0.5s, background 0.5s;
    }
    .avatar.add-profile:hover .add-button-content {
      border-color: #888;
      background: #111;
    }
    .add-icon {
      font-size: 60px;
      color: #555;
      line-height: 1;
    }
    .add-profile-text {
      margin-top: 10px;
      color: #888;
      font-weight: bold;
      font-size: 17px;
    }
    /* Modal Styles */
    .modal-overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.8);
      z-index: 1000;
      align-items: center;
      justify-content: center;
    }
    .modal-overlay.show {
      display: flex;
    }
    .modal-content {
      background: rgba(0, 0, 0, 0.9);
      padding: 32px;
      border-radius: 12px;
      width: 90%;
      max-width: 400px;
      border: 1px solid #333;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
    }
    .modal-content h2 {
      margin: 0 0 20px;
      font-size: 24px;
      color: #fff;
    }
    .modal-field {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-bottom: 16px;
    }
    .modal-label {
      font-size: 14px;
      color: #b3b3b3;
    }
    .modal-input {
      padding: 12px;
      border: 1px solid #333;
      border-radius: 8px;
      background: #111;
      color: #e5e5e5;
      font-size: 16px;
    }
    .modal-input:focus {
      outline: 2px solid #fff;
      border-color: #fff;
    }
    .modal-buttons {
      display: flex;
      gap: 12px;
      margin-top: 24px;
    }
    .modal-btn {
      flex: 1;
      padding: 12px;
      border: none;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
      font-size: 16px;
      transition: opacity 0.2s;
    }
    .modal-btn:hover {
      opacity: 0.9;
    }
    .modal-btn-primary {
      background: #e50914;
      color: white;
    }
    .modal-btn-secondary {
      background: #333;
      color: white;
    }
    .modal-error {
      color: #ff6b6b;
      font-size: 12px;
      margin-top: -10px;
      margin-bottom: 10px;
    }
  </style>
</head>
<body>
  <!-- Modal for adding new profile -->
  <div class="modal-overlay" id="profileModal">
    <div class="modal-content">
      <h2>יצירת פרופיל חדש</h2>
      <form id="profileForm">
        <div class="modal-field">
          <label class="modal-label">שם הפרופיל</label>
          <input type="text" class="modal-input" id="profileNameInput" placeholder="הזן שם פרופיל" required>
          <div class="modal-error" id="profileError"></div>
        </div>
        <div class="modal-buttons">
          <button type="button" class="modal-btn modal-btn-secondary" onclick="closeProfileModal()">ביטול</button>
          <button type="submit" class="modal-btn modal-btn-primary">יצירה</button>
        </div>
      </form>
    </div>
  </div>

  <main class="center">
    <h1>מי צופה?</h1>
    <ul class="avatar-grid" id="profiles"></ul>
    <button class="btn-outline">נהל פרופילים</button>
  </main>

  <script>
    const profilesContainer = document.getElementById("profiles");
    const API_BASE_URL = 'http://localhost:5001/api/users';
    
    let currentProfiles = [];
    let canAddProfile = true;

    // Check if user is logged in
    const userId = localStorage.getItem("userId");
    if (!userId) {
      alert("אנא התחבר תחילה");
      window.location.href = "index.html";
    }

    // טעינת פרופילים מהשרת
    async function loadProfiles() {
      try {
        const response = await fetch(`${API_BASE_URL}/${userId}/profiles`, {
          method: 'GET',
          credentials: 'include'
        });
        
        if (!response.ok) {
          throw new Error('Failed to load profiles');
        }
        
        const data = await response.json();
        currentProfiles = data.profiles || [];
        canAddProfile = data.canAddProfile !== false;
        
        // Update localStorage for compatibility
        const profilesForLocalStorage = currentProfiles.map((p, idx) => ({
          id: idx + 1,
          name: p.name,
          img: p.avatar || "https://picsum.photos/seed/" + (idx + 1) + "/200"
        }));
        localStorage.setItem("userProfiles", JSON.stringify(profilesForLocalStorage));
        
        return currentProfiles;
      } catch (error) {
        console.error('Error loading profiles:', error);
        // Fallback to localStorage if API fails
        const storedProfiles = localStorage.getItem("userProfiles");
        if (storedProfiles) {
          currentProfiles = JSON.parse(storedProfiles);
          canAddProfile = currentProfiles.length < 5;
          return currentProfiles;
        }
        return [];
      }
    }

    // Modal functions
    function openProfileModal() {
      if (!canAddProfile) {
        alert("לא ניתן להוסיף יותר מ-5 פרופילים");
        return;
      }
      const modal = document.getElementById("profileModal");
      const input = document.getElementById("profileNameInput");
      const error = document.getElementById("profileError");
      modal.classList.add("show");
      input.value = "";
      error.textContent = "";
      input.focus();
    }

    function closeProfileModal() {
      const modal = document.getElementById("profileModal");
      modal.classList.remove("show");
    }

    // Close modal when clicking outside
    document.getElementById("profileModal").addEventListener("click", function(e) {
      if (e.target === this) {
        closeProfileModal();
      }
    });

    // Close modal with ESC key
    document.addEventListener("keydown", function(e) {
      if (e.key === "Escape") {
        const modal = document.getElementById("profileModal");
        if (modal.classList.contains("show")) {
          closeProfileModal();
        }
      }
    });

    // Handle form submission
    document.getElementById("profileForm").addEventListener("submit", async function(e) {
      e.preventDefault();
      const profileNameInput = document.getElementById("profileNameInput");
      const profileError = document.getElementById("profileError");
      const profileName = profileNameInput.value.trim();

      if (!profileName) {
        profileError.textContent = "אנא הזן שם פרופיל";
        return;
      }

      if (!canAddProfile) {
        profileError.textContent = "לא ניתן להוסיף יותר מ-5 פרופילים";
        return;
      }

      // Check if profile name already exists (case-insensitive)
      const existingProfile = currentProfiles.find(
        profile => profile.name && profile.name.toLowerCase() === profileName.toLowerCase()
      );
      
      if (existingProfile) {
        profileError.textContent = "שם פרופיל זה כבר קיים. אנא בחר שם אחר.";
        return;
      }

      profileError.textContent = "";

      const defaultAvatars = [
        "https://images.unsplash.com/photo-1517191434949-5e90cd67d2b6?w=900",
        "https://picsum.photos/seed/2/200",
        "https://images.unsplash.com/photo-1596464716127-f2a82984de30?w=900",
        "https://images.unsplash.com/photo-1665333354010-050f08f35907?w=900",
        "https://picsum.photos/seed/" + Date.now() + "/200"
      ];
      const randomAvatar = defaultAvatars[Math.floor(Math.random() * defaultAvatars.length)];

      try {
        const response = await fetch(`${API_BASE_URL}/profiles/add`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
          },
          credentials: 'include',
          body: JSON.stringify({
            userId: userId,
            name: profileName,
            avatar: randomAvatar
          })
        });

        const data = await response.json();
        
        if (!response.ok) {
          profileError.textContent = data.message || "שגיאה ביצירת פרופיל";
          return;
        }

        // Close modal and reload profiles after successful creation
        closeProfileModal();
        await renderProfiles();
      } catch (error) {
        console.error('Error creating profile:', error);
        profileError.textContent = "שגיאה ביצירת פרופיל. נסה שוב.";
      }
    });

    // יצירת פרופיל חדש
    function createNewProfile() {
      openProfileModal();
    }

    // הצגת פרופילים בעמוד
    async function renderProfiles() {
      await loadProfiles();
      profilesContainer.innerHTML = "";

      // Convert backend profiles to frontend format
      const displayProfiles = currentProfiles.map((p, idx) => ({
        id: idx + 1,
        name: p.name,
        img: p.avatar || "https://picsum.photos/seed/" + (idx + 1) + "/200",
        originalProfile: p // Keep original for reference
      }));

      // יצירת פרופילים קיימים
      displayProfiles.forEach(profile => {
        const li = document.createElement("li");
        li.classList.add("avatar");
        li.innerHTML = `
          <img src="${profile.img}" alt="${profile.name}">
          <p>${profile.name}</p>
        `;
        li.addEventListener("click", () => {
          // שמירת הפרופיל ב-localStorage
          localStorage.setItem("activeProfile", JSON.stringify({
            id: profile.id,
            name: profile.name,
            img: profile.img,
            userId: userId,
            originalProfile: profile.originalProfile
          }));
          // מעבר לעמוד הראשי
          window.location.href = "main-page.html";
        });
        profilesContainer.appendChild(li);
      });

      // הוספת כפתור יצירת פרופיל חדש רק אם יש פחות מ-5 פרופילים
      if (canAddProfile && displayProfiles.length < 5) {
        const addLi = document.createElement("li");
        addLi.classList.add("avatar", "add-profile");
        addLi.innerHTML = `
          <div class="add-button-content">
            <div class="add-icon">+</div>
            <p class="add-profile-text">פרופיל חדש</p>
          </div>
        `;
        addLi.addEventListener("click", createNewProfile);
        profilesContainer.appendChild(addLi);
      }
    }

    // טעינת הפרופילים בהתחלה
    renderProfiles();
  </script>
</body>
</html>
