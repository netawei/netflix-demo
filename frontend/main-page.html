<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>דף ראשי עם לייקים, מיון וחיפוש</title>
  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #111;
      color: #fff;
    }
    .navbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px 24px;
      font-size: 20px;
      background: #000;
    }
    .navbar .logo {
      font-size: 30px;
      font-weight: bold;
      color: #e50914;
    }
    .navbar ul {
      display: flex;
      list-style: none;
      gap: 20px;
      margin: 0;
      padding: 0;
      align-items: center;
    }
    .navbar li a {
      color: #fff;
      text-decoration: none;
    }
    .navbar li a:hover {
      color: #e50914;
    }
    #logoutBtn {
      padding: 6px 12px;
      font-size: 16px;
      border-radius: 6px;
      border: none;
      cursor: pointer;
      background: #e50914;
      color: #fff;
      transition: background 0.2s;
    }
    #logoutBtn:hover {
      background: #c50e15;
    }
    .content {
      padding: 40px;
      text-align: center;
    }
    .greeting {
      margin-bottom: 20px;
      font-size: 24px;
      font-weight: bold;
    }
    .search-box {
      padding: 10px;
      font-size: 16px;
      border-radius: 6px;
      border: none;
      width: 250px;
      margin-bottom: 20px;
      text-align: right;
    }
    .sort-btn {
      cursor: pointer;
      padding: 10px 20px;
      background: linear-gradient(135deg, #e50914, #b00610);
      border: none;
      color: #fff;
      font-weight: bold;
      border-radius: 6px;
      margin-bottom: 20px;
      transition: transform 0.2s, background 0.3s;
    }
    .sort-btn:hover {
      background: linear-gradient(135deg, #f6121d, #c50e15);
      transform: scale(1.05);
    }
    .catalog {
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
      justify-content: center;
      margin-top: 20px;
    }
    .item {
      background: #222;
      padding: 16px;
      border-radius: 10px;
      width: 200px;
      min-height: 520px;
      text-align: right;
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    .item h3 {
      margin: 8px 0 4px 0;
      font-size: 16px;
      color: #fff;
      font-weight: bold;
      line-height: 1.3;
      min-height: 2.6em;
    }
    .item img {
      width: 100%;
      height: 280px;
      object-fit: cover;
      border-radius: 8px;
      margin-bottom: 8px;
      display: block;
    }
    .item p {
      margin: 4px 0;
      font-size: 14px;
    }
    .item-description {
      font-size: 12px;
      color: #b3b3b3;
      margin: 8px 0;
      line-height: 1.4;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
      text-overflow: ellipsis;
      max-height: 3.6em;
    }
    .item-rating {
      display: flex;
      align-items: center;
      gap: 5px;
      margin: 6px 0;
      font-size: 13px;
    }
    .rating-stars {
      color: #fbbf24;
      font-size: 14px;
    }
    .rating-value {
      color: #fff;
      font-weight: bold;
    }
    .rating-label {
      color: #b3b3b3;
      font-size: 12px;
    }
    .item-director {
      font-size: 12px;
      color: #b3b3b3;
      margin: 4px 0;
    }
    .item-director strong {
      color: #fff;
    }
    .item-cast {
      font-size: 11px;
      color: #b3b3b3;
      margin: 4px 0;
      line-height: 1.4;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .item-cast strong {
      color: #fff;
    }
    .item-genre {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
      margin: 6px 0;
    }
    .genre-tag {
      background: rgba(229, 9, 20, 0.2);
      color: #e50914;
      padding: 2px 8px;
      border-radius: 12px;
      font-size: 10px;
      border: 1px solid rgba(229, 9, 20, 0.3);
    }
    .like-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      padding: 6px 10px;
      border-radius: 6px;
      background: #333;
      color: #fff;
      font-weight: bold;
      border: none;
      transition: background 0.2s, color 0.2s;
      position: relative;
      margin-top: auto;
    }
    .like-btn.liked {
      background: #e50914;
      color: #fff;
    }
    .heart {
      display: inline-block;
      transition: transform 0.3s;
      position: relative;
      z-index: 2;
    }
    .heart.animate {
      transform: scale(1.5);
    }
    .particle {
      position: absolute;
      width: 6px;
      height: 6px;
      background: #e50914;
      border-radius: 50%;
      animation: fly 0.6s forwards;
      pointer-events: none;
      z-index: 1;
    }
    @keyframes fly {
      0% { transform: translate(0,0) scale(1); opacity: 1; }
      100% { transform: translate(var(--x), var(--y)) scale(0); opacity: 0; }
    }
  </style>
</head>
<body>
  <header class="navbar">
    <div class="logo">Netflix</div>
    <ul>
      <li><a href="#">בית</a></li>
      <li><a href="#">סדרות</a></li>
      <li><a href="#">סרטים</a></li>
      <li><a href="profiles.html">החלף פרופיל</a></li>
      <li><button id="logoutBtn">התנתקות</button></li>
    </ul>
  </header>

  <main class="content">
    <div class="greeting" id="greeting"></div>
    <input type="text" id="searchInput" class="search-box" placeholder="חפש סרט או סדרה...">
    <br>
    <button class="sort-btn" id="sortBtn">מיין אלפביתי לפי שם</button>
    <div class="catalog" id="newestCatalog"></div>
    <div class="catalog" id="catalog"></div>
  </main>



  <script>
    const activeProfile = JSON.parse(localStorage.getItem("activeProfile"));
    if (activeProfile) {
      document.getElementById("greeting").textContent = `שלום, ${activeProfile.name}`;
    } else {
      window.location.href = "profiles.html";
    }
  
    document.getElementById("logoutBtn").addEventListener("click", () => {
      // Logout from backend
      fetch('http://localhost:5001/api/users/logout', {
        method: 'GET',
        credentials: 'include'
      }).catch(err => console.error('Logout error:', err));
      
      // Clear all user data from localStorage
      localStorage.removeItem("activeProfile");
      localStorage.removeItem("isLoggedIn");
      localStorage.removeItem("userEmail");
      localStorage.removeItem("userId");
      localStorage.removeItem("userName");
      localStorage.removeItem("userProfiles");
      window.location.href = "index.html";
    });

    const API_BASE_URL = 'http://localhost:5001/api/users';
    const userId = activeProfile?.userId || localStorage.getItem("userId");
    const profileName = activeProfile?.name;
    let likedContentIds = []; // Array of content IDs that are liked by this profile
    

    const catalogDiv = document.getElementById("catalog");
    const newestDiv = document.getElementById("newestCatalog");
    const searchInput = document.getElementById("searchInput");
    const sortBtn = document.getElementById("sortBtn");
  
    let catalog = [];
    let groupedCatalog = {};
    let isSorted = false;
    const storedLikes = JSON.parse(localStorage.getItem("likes")) || {};
  
    fetch("http://localhost:5001/api/content")
      .then(res => res.json())
      .then(data => {
        catalog = data.map(content => {
          const timeMs = new Date(content.updatedAt).getTime();
          return {
            id: String(content._id), // Ensure ID is always a string
            name: content.title,
            year: content.releaseYear,
            likes: content.likes || 0,
            img: content.posterUrl,
            genre: content.genre || [],
            director: content.director || '',
            cast: content.cast || [],
            description: content.description || '',
            rating: content.rating || null,
            updatedAt: isNaN(timeMs) ? 0 : timeMs // if updatedAt doesnt exists, treat as very old content
          };
        });
        // After catalog is loaded, load liked content and render
        loadLikedContent().then((loadedIds) => {
          console.log('Loaded liked content IDs for profile:', profileName, 'IDs:', loadedIds);
          renderCatalog(catalog);
        }).catch(err => {
          console.error('Error loading liked content:', err);
          renderCatalog(catalog);
        });
      })
      .catch(err => console.error("Fetch error:", err));

    // Load liked content from backend
    async function loadLikedContent() {
      if (!userId || !profileName) {
        console.warn('No userId or profileName, using localStorage fallback');
        const storedLikes = JSON.parse(localStorage.getItem(`likes_${userId}_${profileName}`)) || {};
        return Object.keys(storedLikes).filter(key => storedLikes[key].liked);
      }

      try {
        const response = await fetch(`${API_BASE_URL}/profiles/liked-content`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
          },
          credentials: 'include',
          body: JSON.stringify({
            userId: userId,
            profileName: profileName
          })
        });

        if (response.ok) {
          const data = await response.json();
          // Ensure all IDs are strings for consistent comparison
          likedContentIds = (data.likedContent || []).map(id => String(id));
          return likedContentIds;
        } else {
          throw new Error('Failed to load liked content');
        }
      } catch (error) {
        console.error('Error loading liked content:', error);
        // Fallback to localStorage
        const storedLikes = JSON.parse(localStorage.getItem(`likes_${userId}_${profileName}`)) || {};
        return Object.keys(storedLikes).filter(key => storedLikes[key].liked);
      }
    }

    // Helper function to format movie metadata
    function formatMovieMetadata(item) {
      const ratingDisplay = item.rating && item.rating !== -1 
        ? `<div class="item-rating">
             <span class="rating-value">${parseFloat(item.rating).toFixed(1)}</span>
             <span class="rating-stars">⭐</span>
           </div>`
        : '';
      
      const descriptionDisplay = item.description 
        ? `<p class="item-description" title="${item.description}">${item.description}</p>`
        : '';
      
      const directorDisplay = item.director 
        ? `<p class="item-director"><strong>במאי:</strong> ${item.director}</p>`
        : '';
      
      const castDisplay = item.cast && item.cast.length > 0
        ? `<p class="item-cast"><strong>שחקנים:</strong> ${item.cast.slice(0, 3).join(', ')}${item.cast.length > 3 ? '...' : ''}</p>`
        : '';
      
      const genreDisplay = item.genre && item.genre.length > 0
        ? `<div class="item-genre">${item.genre.slice(0, 3).map(g => `<span class="genre-tag">${g}</span>`).join('')}</div>`
        : '';
      
      return {
        ratingDisplay,
        descriptionDisplay,
        directorDisplay,
        castDisplay,
        genreDisplay
      };
    }

    function renderCatalog(items) {
      // Update liked status for all items
      items.forEach(item => {
        // Check if this content is liked by the current profile
        // Convert both to strings for consistent comparison
        const itemIdStr = String(item.id);
        item.liked = likedContentIds.some(likedId => String(likedId) === itemIdStr);
      });
      
      // Get the 10 newest items
      const newest = [...items]
        .sort((a, b) => {
          const dateA = new Date(a.updatedAt);
          const dateB = new Date(b.updatedAt);
          console.log('Comparing:', a.name, dateA, 'vs', b.name, dateB, '=>', dateB - dateA);
          return dateB - dateA;
        })
        .slice(0, 10);
      
      renderNewest(newest);
      groupByGenre();
      renderGroupedCatalog();
    }
  
    function renderNewest(list) {
      newestDiv.innerHTML = "";
      const title = document.createElement("h2");
      title.textContent = "10 הסדרות החדשות ביותר";
      title.style.textAlign = "center";
      title.style.marginTop = "40px";
      title.style.color = "#e50914";
      title.style.fontSize = "28px";
      title.style.fontWeight = "bold";
      
      newestDiv.appendChild(title);
      const grid = document.createElement("div");
      grid.classList.add("catalog-grid");
      grid.style.display = "flex";
      grid.style.flexWrap = "wrap";
      grid.style.gap = "20px";
      grid.style.justifyContent = "flex-start";
      
      list.forEach(item => {
        // Use the liked status from likedContentIds (loaded from database)
        // item.liked is already set in renderCatalog() based on likedContentIds
        // Only use storedLikes for likes count if needed, but not for liked status
        if (storedLikes[item.id] && storedLikes[item.id].likes !== undefined) {
          item.likes = storedLikes[item.id].likes;
        }
        // Ensure liked status is based on database (likedContentIds)
        // item.liked should already be set correctly in renderCatalog()
        const itemIdStr = String(item.id);
        item.liked = likedContentIds.some(likedId => String(likedId) === itemIdStr);

        const div = document.createElement("div");
        div.classList.add("item");
        const metadata = formatMovieMetadata(item);
        div.innerHTML = `
          <img src="${item.img}" alt="${item.name}">
          <h3>${item.name}</h3>
          ${metadata.ratingDisplay}
          ${metadata.genreDisplay}
          <p><strong>שנה:</strong> ${item.year}</p>
          ${metadata.directorDisplay}
          ${metadata.castDisplay}
          ${metadata.descriptionDisplay}
          <p><strong>לייקים:</strong> <span class="like-count">${item.likes}</span></p>
          <button class="like-btn ${item.liked ? 'liked' : ''}">
            <span class="heart">${item.liked ? '❤️' : '🤍'}</span> לייק
          </button>
        `;
        grid.appendChild(div);

        const btn = div.querySelector(".like-btn");
        const heart = btn.querySelector(".heart");
        const count = div.querySelector(".like-count");

        btn.addEventListener("click", async () => {
          const wasLiked = item.liked;
          item.liked = !item.liked;
          
          // Update UI immediately for better UX
          if(item.liked){
            item.likes++;
            btn.classList.add("liked");
            heart.textContent = '❤️';
            heart.classList.add("animate");
            createParticles(div);
            likedContentIds.push(item.id);
          } else {
            item.likes--;
            btn.classList.remove("liked");
            heart.textContent = '🤍';
            likedContentIds = likedContentIds.filter(id => id !== item.id);
          }
          count.textContent = item.likes;
          setTimeout(() => heart.classList.remove("animate"), 300);

          // Save to backend
          if (userId && profileName) {
            try {
              const response = await fetch(`${API_BASE_URL}/profiles/like`, {
                method: 'POST',
                headers: {
                  'Content-Type': 'application/json',
                },
                credentials: 'include',
                  body: JSON.stringify({
                  userId: userId,
                  profileName: profileName,
                  contentId: String(item.id), // Ensure contentId is a string
                  contentGenres: item.genre || []
                })
              });

              if (response.ok) {
                // Update likedContentIds from server response to ensure consistency
                const data = await response.json();
                if (data.likedContent) {
                  likedContentIds = data.likedContent.map(id => String(id));
                  console.log('Like saved successfully. Updated likedContentIds:', likedContentIds);
                }
              } else {
                // Revert if save failed
                const errorData = await response.json().catch(() => ({ message: 'Unknown error' }));
                item.liked = wasLiked;
                if(wasLiked) {
                  item.likes--;
                  btn.classList.remove("liked");
                  heart.textContent = '🤍';
                  likedContentIds = likedContentIds.filter(id => String(id) !== String(item.id));
                } else {
                  item.likes++;
                  btn.classList.add("liked");
                  heart.textContent = '❤️';
                  likedContentIds.push(String(item.id));
                }
                count.textContent = item.likes;
                alert("שגיאה בשמירת הלייק. נסה שוב.");
                console.error('Save failed:', errorData);
              }
            } catch (error) {
              console.error('Error saving like:', error);
              // Revert on error
              item.liked = wasLiked;
              if(wasLiked) {
                item.likes--;
                btn.classList.remove("liked");
                heart.textContent = '🤍';
                likedContentIds = likedContentIds.filter(id => id !== item.id);
              } else {
                item.likes++;
                btn.classList.add("liked");
                heart.textContent = '❤️';
                likedContentIds.push(item.id);
              }
              count.textContent = item.likes;
              alert("שגיאה בשמירת הלייק. נסה שוב.");
            }
          } else {
            // Fallback to localStorage if no userId/profileName
            const storedLikes = JSON.parse(localStorage.getItem(`likes_${userId}_${profileName}`)) || {};
            storedLikes[item.id] = { likes: item.likes, liked: item.liked };
            localStorage.setItem(`likes_${userId}_${profileName}`, JSON.stringify(storedLikes));
          }

        });
      });
      newestDiv.appendChild(grid);
    }
    function groupByGenre() {
      groupedCatalog = {};
      catalog.forEach(item => {
        if (!item.genre || item.genre.length === 0) {
          item.genre = ["NoIdeaGenre"]; 
        }
        item.genre.forEach(g => {
          const genre = g.trim();
          if (!groupedCatalog[genre]) groupedCatalog[genre] = [];
          groupedCatalog[genre].push(item);
        });
      });
    }
  
    function renderGroupedCatalog() {
      catalogDiv.innerHTML = "";
      Object.keys(groupedCatalog).forEach(genre => {
        const section = document.createElement("div");
        section.classList.add("genre-section");
        const title = document.createElement("h2");
        title.textContent = genre;
        title.style.textAlign = "right";
        title.style.marginTop = "40px";
        title.style.color = "#e50914";
  
        const grid = document.createElement("div");
        grid.classList.add("catalog-grid");
        grid.style.display = "flex";
        grid.style.flexWrap = "wrap";
        grid.style.gap = "20px";
        grid.style.justifyContent = "flex-start";
  
        groupedCatalog[genre].forEach(item => {
          // Use the liked status from likedContentIds (loaded from database)
          // item.liked is already set in renderCatalog() based on likedContentIds
          // Only use storedLikes for likes count if needed, but not for liked status
          if (storedLikes[item.id] !== undefined && storedLikes[item.id].likes !== undefined) {
            item.likes = storedLikes[item.id].likes;
          }
          // Ensure liked status is based on database (likedContentIds)
          // item.liked should already be set correctly in renderCatalog()
          const itemIdStr = String(item.id);
          item.liked = likedContentIds.some(likedId => String(likedId) === itemIdStr);

          const div = document.createElement("div");
          div.classList.add("item");
          const metadata = formatMovieMetadata(item);
          div.innerHTML = `
            <img src="${item.img}" alt="${item.name}">
            <h3>${item.name}</h3>
            ${metadata.ratingDisplay}
            ${metadata.genreDisplay}
            <p><strong>שנה:</strong> ${item.year}</p>
            ${metadata.directorDisplay}
            ${metadata.castDisplay}
            ${metadata.descriptionDisplay}
            <p><strong>לייקים:</strong> <span class="like-count">${item.likes}</span></p>
            <button class="like-btn ${item.liked ? 'liked' : ''}">
              <span class="heart">${item.liked ? '❤️' : '🤍'}</span> לייק
            </button>
          `;
  
          grid.appendChild(div);
  
          const btn = div.querySelector(".like-btn");
          const heart = btn.querySelector(".heart");
          const count = div.querySelector(".like-count");
  
          btn.addEventListener("click", async () => {
            const wasLiked = item.liked;
            item.liked = !item.liked;
            
            // Update UI immediately for better UX
            if(item.liked){
              item.likes++;
              btn.classList.add("liked");
              heart.textContent = '❤️';
              heart.classList.add("animate");
              createParticles(div);
              likedContentIds.push(String(item.id));
            } else {
              item.likes--;
              btn.classList.remove("liked");
              heart.textContent = '🤍';
              likedContentIds = likedContentIds.filter(id => String(id) !== String(item.id));
            }
            count.textContent = item.likes;
            setTimeout(() => heart.classList.remove("animate"), 300);

            // Save to backend
            if (userId && profileName) {
              try {
                const response = await fetch(`${API_BASE_URL}/profiles/like`, {
                  method: 'POST',
                  headers: {
                    'Content-Type': 'application/json',
                  },
                  credentials: 'include',
                  body: JSON.stringify({
                    userId: userId,
                    profileName: profileName,
                    contentId: String(item.id), // Ensure contentId is a string
                    contentGenres: item.genre || []
                  })
                });

                if (response.ok) {
                  // Update likedContentIds from server response to ensure consistency
                  const data = await response.json();
                  if (data.likedContent) {
                    likedContentIds = data.likedContent.map(id => String(id));
                  }
                } else {
                  // Revert if save failed
                  const errorData = await response.json().catch(() => ({ message: 'Unknown error' }));
                  item.liked = wasLiked;
                  if(wasLiked) {
                    item.likes--;
                    btn.classList.remove("liked");
                    heart.textContent = '🤍';
                    likedContentIds = likedContentIds.filter(id => String(id) !== String(item.id));
                  } else {
                    item.likes++;
                    btn.classList.add("liked");
                    heart.textContent = '❤️';
                    likedContentIds.push(String(item.id));
                  }
                  count.textContent = item.likes;
                  alert("שגיאה בשמירת הלייק. נסה שוב.");
                  console.error('Save failed:', errorData);
                }
              } catch (error) {
                console.error('Error saving like:', error);
                // Revert on error
                item.liked = wasLiked;
                if(wasLiked) {
                  item.likes--;
                  btn.classList.remove("liked");
                  heart.textContent = '🤍';
                  likedContentIds = likedContentIds.filter(id => id !== item.id);
                } else {
                  item.likes++;
                  btn.classList.add("liked");
                  heart.textContent = '❤️';
                  likedContentIds.push(item.id);
                }
                count.textContent = item.likes;
                alert("שגיאה בשמירת הלייק. נסה שוב.");
              }
            } else {
              // Fallback to localStorage if no userId/profileName
              const storedLikes = JSON.parse(localStorage.getItem(`likes_${userId}_${profileName}`)) || {};
              storedLikes[item.id] = { likes: item.likes, liked: item.liked };
              localStorage.setItem(`likes_${userId}_${profileName}`, JSON.stringify(storedLikes));
            }
          });
        });
  
        section.appendChild(title);
        section.appendChild(grid);
        catalogDiv.appendChild(section);
      });
    }
    
    function renderFlatCatalog(list) {
  catalogDiv.innerHTML = ""; // clear everything
  newestDiv.innerHTML = ""; // clear everything

  const title = document.createElement("h2");
  title.textContent = `Search Results(${list.length})`;
  title.style.textAlign = "center";
  title.style.marginTop = "40px";
  title.style.color = "#e50914";
  title.style.fontSize = "28px";
  title.style.fontWeight = "bold";

  catalogDiv.appendChild(title);

  const grid = document.createElement("div");
  grid.classList.add("catalog-grid");
  grid.style.display = "flex";
  grid.style.flexWrap = "wrap";
  grid.style.gap = "20px";
  grid.style.justifyContent = "flex-start";

  list.forEach(item => {
    // Use the liked status from likedContentIds (loaded from database)
    // Only use storedLikes for likes count if needed, but not for liked status
    if (storedLikes[item.id] !== undefined && storedLikes[item.id].likes !== undefined) {
      item.likes = storedLikes[item.id].likes;
    }
    // Ensure liked status is based on database (likedContentIds)
    const itemIdStr = String(item.id);
    item.liked = likedContentIds.some(likedId => String(likedId) === itemIdStr);

    const div = document.createElement("div");
    div.classList.add("item");
    const metadata = formatMovieMetadata(item);
    div.innerHTML = `
      <img src="${item.img}" alt="${item.name}">
      <h3>${item.name}</h3>
      ${metadata.ratingDisplay}
      ${metadata.genreDisplay}
      <p><strong>שנה:</strong> ${item.year}</p>
      ${metadata.directorDisplay}
      ${metadata.castDisplay}
      ${metadata.descriptionDisplay}
      <p><strong>לייקים:</strong> <span class="like-count">${item.likes}</span></p>
      <button class="like-btn ${item.liked ? 'liked' : ''}">
        <span class="heart">${item.liked ? '❤️' : '🤍'}</span> לייק
      </button>
    `;

    grid.appendChild(div);

    const btn = div.querySelector(".like-btn");
    const heart = btn.querySelector(".heart");
    const count = div.querySelector(".like-count");

    btn.addEventListener("click", async () => {
      const wasLiked = item.liked;
      item.liked = !item.liked;
      
      // Update UI immediately for better UX
      if(item.liked){
        item.likes++;
        btn.classList.add("liked");
        heart.textContent = '❤️';
        heart.classList.add("animate");
        createParticles(div);
        likedContentIds.push(item.id);
      } else {
        item.likes--;
        btn.classList.remove("liked");
        heart.textContent = '🤍';
        likedContentIds = likedContentIds.filter(id => id !== item.id);
      }
      count.textContent = item.likes;
      setTimeout(() => heart.classList.remove("animate"), 300);

      // Save to backend
      if (userId && profileName) {
        try {
          const response = await fetch(`${API_BASE_URL}/profiles/like`, {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
            },
            credentials: 'include',
            body: JSON.stringify({
              userId: userId,
              profileName: profileName,
              contentId: String(item.id), // Ensure contentId is a string
              contentGenres: item.genre || []
            })
          });

          if (response.ok) {
            // Update likedContentIds from server response to ensure consistency
            const data = await response.json();
            if (data.likedContent) {
              likedContentIds = data.likedContent.map(id => String(id));
              console.log('Like saved successfully. Updated likedContentIds:', likedContentIds);
            }
          } else {
            // Revert if save failed
            const errorData = await response.json().catch(() => ({ message: 'Unknown error' }));
            item.liked = wasLiked;
            if(wasLiked) {
              item.likes--;
              btn.classList.remove("liked");
              heart.textContent = '🤍';
              likedContentIds = likedContentIds.filter(id => String(id) !== String(item.id));
            } else {
              item.likes++;
              btn.classList.add("liked");
              heart.textContent = '❤️';
              likedContentIds.push(String(item.id));
            }
            count.textContent = item.likes;
            alert("שגיאה בשמירת הלייק. נסה שוב.");
            console.error('Save failed:', errorData);
          }
        } catch (error) {
          console.error('Error saving like:', error);
          // Revert on error
          item.liked = wasLiked;
          if(wasLiked) {
            item.likes--;
            btn.classList.remove("liked");
            heart.textContent = '🤍';
            likedContentIds = likedContentIds.filter(id => id !== item.id);
          } else {
            item.likes++;
            btn.classList.add("liked");
            heart.textContent = '❤️';
            likedContentIds.push(item.id);
          }
          count.textContent = item.likes;
          alert("שגיאה בשמירת הלייק. נסה שוב.");
        }
      } else {
        // Fallback to localStorage if no userId/profileName
        const storedLikes = JSON.parse(localStorage.getItem(`likes_${userId}_${profileName}`)) || {};
        storedLikes[item.id] = { likes: item.likes, liked: item.liked };
        localStorage.setItem(`likes_${userId}_${profileName}`, JSON.stringify(storedLikes));
      }
    });
  });

  catalogDiv.appendChild(grid);
}

    function createParticles(container) {
      for (let i = 0; i < 8; i++) {
        const particle = document.createElement("span");
        particle.classList.add("particle");
        const x = Math.random() * 80 - 40 + "px";
        const y = -Math.random() * 60 - 20 + "px";
        particle.style.setProperty("--x", x);
        particle.style.setProperty("--y", y);
        container.appendChild(particle);
        setTimeout(() => container.removeChild(particle), 600);
      }
    }



    sortBtn.addEventListener("click", () => {
      if (!isSorted) {
        catalog.sort((a, b) => a.name.localeCompare(b.name));
        isSorted = true;
        sortBtn.textContent = "החזר לסדר המקורי";
      } else {
        catalog.sort((a, b) => new Date(b.updatedAt) - new Date(a.updatedAt));
        isSorted = false;
        sortBtn.textContent = "מיין אלפביתי לפי שם";
      }
      groupByGenre();
      renderGroupedCatalog();
    });
  
    // Search filter
    searchInput.addEventListener("input", () => {
  const query = searchInput.value.toLowerCase();

  if (!query) {
    // If search is empty, go back to grouped view
    const newest = [...catalog]
    .sort((a, b) => {
          const dateA = new Date(a.updatedAt);
          const dateB = new Date(b.updatedAt);
          console.log('Comparing:', a.name, dateA, 'vs', b.name, dateB, '=>', dateB - dateA);
          return dateB - dateA;
      })
      .slice(0, 10);
    renderNewest(newest);
    groupByGenre();
    renderGroupedCatalog();
    return;
  }

  // Filter catalog
  const filtered = catalog.filter(
    item =>
      item.name.toLowerCase().includes(query) ||
      item.genre.some(g => g.toLowerCase().includes(query))
  );

  // Render flat list
  renderFlatCatalog(filtered);
});
    
  </script>
</body>
</html>
