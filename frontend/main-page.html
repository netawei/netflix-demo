<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>דף ראשי עם לייקים, מיון וחיפוש</title>
  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #111;
      color: #fff;
    }
    .navbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px 24px;
      font-size: 20px;
      background: #000;
    }
    .navbar .logo {
      font-size: 30px;
      font-weight: bold;
      color: #e50914;
    }
    .navbar ul {
      display: flex;
      list-style: none;
      gap: 20px;
      margin: 0;
      padding: 0;
      align-items: center;
    }
    .navbar li a {
      color: #fff;
      text-decoration: none;
    }
    .navbar li a:hover {
      color: #e50914;
    }
    #logoutBtn {
      padding: 6px 12px;
      font-size: 16px;
      border-radius: 6px;
      border: none;
      cursor: pointer;
      background: #e50914;
      color: #fff;
      transition: background 0.2s;
    }
    #logoutBtn:hover {
      background: #c50e15;
    }
    .content {
      padding: 40px;
      text-align: center;
    }
    .greeting {
      margin-bottom: 20px;
      font-size: 24px;
      font-weight: bold;
    }
    .search-box {
      padding: 10px;
      font-size: 16px;
      border-radius: 6px;
      border: none;
      width: 250px;
      margin-bottom: 20px;
      text-align: right;
    }
    .sort-btn {
      cursor: pointer;
      padding: 10px 20px;
      background: linear-gradient(135deg, #e50914, #b00610);
      border: none;
      color: #fff;
      font-weight: bold;
      border-radius: 6px;
      margin-bottom: 20px;
      transition: transform 0.2s, background 0.3s;
    }
    .sort-btn:hover {
      background: linear-gradient(135deg, #f6121d, #c50e15);
      transform: scale(1.05);
    }
    .catalog {
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
      justify-content: center;
      margin-top: 20px;
    }
    .item {
      background: #222;
      padding: 16px;
      border-radius: 10px;
      width: 200px;
      text-align: right;
      position: relative;
      overflow: hidden;
    }
    .item img {
      width: 100%;
      border-radius: 8px;
      margin-bottom: 8px;
      display: block;
    }
    .item h2 {
      margin: 0 0 8px 0;
      font-size: 18px;
      color: #e50914;
    }
    .item p {
      margin: 4px 0;
      font-size: 14px;
    }
    .like-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      padding: 6px 10px;
      border-radius: 6px;
      background: #333;
      color: #fff;
      font-weight: bold;
      border: none;
      transition: background 0.2s, color 0.2s;
      position: relative;
    }
    .like-btn.liked {
      background: #e50914;
      color: #fff;
    }
    .heart {
      display: inline-block;
      transition: transform 0.3s;
      position: relative;
      z-index: 2;
    }
    .heart.animate {
      transform: scale(1.5);
    }
    .particle {
      position: absolute;
      width: 6px;
      height: 6px;
      background: #e50914;
      border-radius: 50%;
      animation: fly 0.6s forwards;
      pointer-events: none;
      z-index: 1;
    }
    @keyframes fly {
      0% { transform: translate(0,0) scale(1); opacity: 1; }
      100% { transform: translate(var(--x), var(--y)) scale(0); opacity: 0; }
    }
  </style>
</head>
<body>
  <header class="navbar">
    <div class="logo">Netflix</div>
    <ul>
      <li><a href="#">בית</a></li>
      <li><a href="#">סדרות</a></li>
      <li><a href="#">סרטים</a></li>
      <li><a href="profiles.html">החלף פרופיל</a></li>
      <li><button id="logoutBtn">התנתקות</button></li>
    </ul>
  </header>

  <main class="content">
    <div class="greeting" id="greeting"></div>
    <input type="text" id="searchInput" class="search-box" placeholder="חפש סרט או סדרה...">
    <br>
    <button class="sort-btn" id="sortBtn">מיין אלפביתי לפי שם</button>
    <div class="catalog" id="newestCatalog"></div>
    <div class="catalog" id="catalog"></div>
  </main>



  <script>
    const activeProfile = JSON.parse(localStorage.getItem("activeProfile"));
    if (activeProfile) {
      document.getElementById("greeting").textContent = `שלום, ${activeProfile.name}`;
    } else {
      window.location.href = "profiles.html";
    }
  
    document.getElementById("logoutBtn").addEventListener("click", () => {
      localStorage.removeItem("activeProfile");
      localStorage.removeItem("isLoggedIn");
      localStorage.removeItem("userEmail");
      window.location.href = "index.html";
    });
  
    const catalogDiv = document.getElementById("catalog");
    const newestDiv = document.getElementById("newestCatalog");
    const searchInput = document.getElementById("searchInput");
    const sortBtn = document.getElementById("sortBtn");
  
    let catalog = [];
    let groupedCatalog = {};
    let isSorted = false;
    const storedLikes = JSON.parse(localStorage.getItem("likes")) || {};
  
    fetch("http://localhost:5001/api/content")
      .then(res => res.json())
      .then(data => {
        catalog = data.map(content => {
          const timeMs = new Date(content.updatedAt).getTime();
        return {
          id: content._id,
          name: content.title,
          year: content.releaseYear,
          likes: content.likes,
          img: content.posterUrl,
          genre: content.genre,
          updatedAt:  isNaN(timeMs) ? 0 : timeMs // if updatedAt doesnt exists, treat as very old content
        };
      });

        const newest = [...catalog]
    .sort((a, b) => {
          const dateA = new Date(a.updatedAt);
          const dateB = new Date(b.updatedAt);
          console.log('Comparing:', a.name, dateA, 'vs', b.name, dateB, '=>', dateB - dateA);
          return dateB - dateA;
      })
      .slice(0, 10);
        renderNewest(newest);

        groupByGenre();
        renderGroupedCatalog();
      })
      .catch(err => console.error("Fetch error:", err));
  
    function renderNewest(list) {
      newestDiv.innerHTML = "";
      const title = document.createElement("h2");
      title.textContent = "10 הסדרות החדשות ביותר";
      title.style.textAlign = "center";
      title.style.marginTop = "40px";
      title.style.color = "#e50914";
      title.style.fontSize = "28px";
      title.style.fontWeight = "bold";
      
      newestDiv.appendChild(title);
      const grid = document.createElement("div");
      grid.classList.add("catalog-grid");
      grid.style.display = "flex";
      grid.style.flexWrap = "wrap";
      grid.style.gap = "20px";
      grid.style.justifyContent = "flex-start";
      
      list.forEach(item => {
        if (storedLikes[item.id]) {
          item.likes = storedLikes[item.id].likes;
          item.liked = storedLikes[item.id].liked;
        } else item.liked = false;

        const div = document.createElement("div");
        div.classList.add("item");
        div.innerHTML = `
          <img src="${item.img}" alt="${item.name}">
          <h3>${item.name}</h3>
          <p><strong>שנה:</strong> ${item.year}</p>
          <p><strong>לייקים:</strong> <span class="like-count">${item.likes}</span></p>
          <button class="like-btn ${item.liked ? 'liked' : ''}">
            <span class="heart">${item.liked ? '❤️' : '🤍'}</span> לייק
          </button>
        `;
        grid.appendChild(div);

        const btn = div.querySelector(".like-btn");
        const heart = btn.querySelector(".heart");
        const count = div.querySelector(".like-count");

        btn.addEventListener("click", () => {
          item.liked = !item.liked;
          item.likes += item.liked ? 1 : -1;
          btn.classList.toggle("liked", item.liked);
          heart.textContent = item.liked ? "❤️" : "🤍";
          if (item.liked) createParticles(div);
          count.textContent = item.likes;
          storedLikes[item.id] = { likes: item.likes, liked: item.liked };
          localStorage.setItem("likes", JSON.stringify(storedLikes));
        });
      });
      newestDiv.appendChild(grid);
    }
    function groupByGenre() {
      groupedCatalog = {};
      catalog.forEach(item => {
        if (!item.genre || item.genre.length === 0) {
          item.genre = ["NoIdeaGenre"]; 
        }
        item.genre.forEach(g => {
          const genre = g.trim();
          if (!groupedCatalog[genre]) groupedCatalog[genre] = [];
          groupedCatalog[genre].push(item);
        });
      });
    }
  
    function renderGroupedCatalog() {
      catalogDiv.innerHTML = "";
      Object.keys(groupedCatalog).forEach(genre => {
        const section = document.createElement("div");
        section.classList.add("genre-section");
        const title = document.createElement("h2");
        title.textContent = genre;
        title.style.textAlign = "right";
        title.style.marginTop = "40px";
        title.style.color = "#e50914";
  
        const grid = document.createElement("div");
        grid.classList.add("catalog-grid");
        grid.style.display = "flex";
        grid.style.flexWrap = "wrap";
        grid.style.gap = "20px";
        grid.style.justifyContent = "flex-start";
  
        groupedCatalog[genre].forEach(item => {
          if (storedLikes[item.id] !== undefined) {
            item.likes = storedLikes[item.id].likes;
            item.liked = storedLikes[item.id].liked;
          } else {
            item.liked = false;
          }
  
          const div = document.createElement("div");
          div.classList.add("item");
          div.innerHTML = `
            <img src="${item.img}" alt="${item.name}">
            <h3>${item.name}</h3>
            <p><strong>שנה:</strong> ${item.year}</p>
            <p><strong>לייקים:</strong> <span class="like-count">${item.likes}</span></p>
            <button class="like-btn ${item.liked ? 'liked' : ''}">
              <span class="heart">${item.liked ? '❤️' : '🤍'}</span> לייק
            </button>
          `;
  
          grid.appendChild(div);
  
          const btn = div.querySelector(".like-btn");
          const heart = btn.querySelector(".heart");
          const count = div.querySelector(".like-count");
  
          btn.addEventListener("click", () => {
            item.liked = !item.liked;
            if (item.liked) {
              item.likes++;
              btn.classList.add("liked");
              heart.textContent = "❤️";
              heart.classList.add("animate");
              createParticles(div);
            } else {
              item.likes--;
              btn.classList.remove("liked");
              heart.textContent = "🤍";
            }
            count.textContent = item.likes;
            setTimeout(() => heart.classList.remove("animate"), 300);
            storedLikes[item.id] = { likes: item.likes, liked: item.liked };
            localStorage.setItem("likes", JSON.stringify(storedLikes));
          });
        });
  
        section.appendChild(title);
        section.appendChild(grid);
        catalogDiv.appendChild(section);
      });
    }
    
    function renderFlatCatalog(list) {
  catalogDiv.innerHTML = ""; // clear everything
  newestDiv.innerHTML = ""; // clear everything

  const title = document.createElement("h2");
  title.textContent = `Search Results(${list.length})`;
  title.style.textAlign = "center";
  title.style.marginTop = "40px";
  title.style.color = "#e50914";
  title.style.fontSize = "28px";
  title.style.fontWeight = "bold";

  catalogDiv.appendChild(title);

  const grid = document.createElement("div");
  grid.classList.add("catalog-grid");
  grid.style.display = "flex";
  grid.style.flexWrap = "wrap";
  grid.style.gap = "20px";
  grid.style.justifyContent = "flex-start";

  list.forEach(item => {
    if (storedLikes[item.id] !== undefined) {
      item.likes = storedLikes[item.id].likes;
      item.liked = storedLikes[item.id].liked;
    } else {
      item.liked = false;
    }

    const div = document.createElement("div");
    div.classList.add("item");
    div.innerHTML = `
      <img src="${item.img}" alt="${item.name}">
      <h3>${item.name}</h3>
      <p><strong>שנה:</strong> ${item.year}</p>
      <p><strong>לייקים:</strong> <span class="like-count">${item.likes}</span></p>
      <button class="like-btn ${item.liked ? 'liked' : ''}">
        <span class="heart">${item.liked ? '❤️' : '🤍'}</span> לייק
      </button>
    `;

    grid.appendChild(div);

    const btn = div.querySelector(".like-btn");
    const heart = btn.querySelector(".heart");
    const count = div.querySelector(".like-count");

    btn.addEventListener("click", () => {
      item.liked = !item.liked;
      if (item.liked) {
        item.likes++;
        btn.classList.add("liked");
        heart.textContent = "❤️";
        heart.classList.add("animate");
        createParticles(div);
      } else {
        item.likes--;
        btn.classList.remove("liked");
        heart.textContent = "🤍";
      }
      count.textContent = item.likes;
      setTimeout(() => heart.classList.remove("animate"), 300);
      storedLikes[item.id] = { likes: item.likes, liked: item.liked };
      localStorage.setItem("likes", JSON.stringify(storedLikes));
    });
  });

  catalogDiv.appendChild(grid);
}

    function createParticles(container) {
      for (let i = 0; i < 8; i++) {
        const particle = document.createElement("span");
        particle.classList.add("particle");
        const x = Math.random() * 80 - 40 + "px";
        const y = -Math.random() * 60 - 20 + "px";
        particle.style.setProperty("--x", x);
        particle.style.setProperty("--y", y);
        container.appendChild(particle);
        setTimeout(() => container.removeChild(particle), 600);
      }
    }
  
    // Sort by name
    sortBtn.addEventListener("click", () => {
      if (!isSorted) {
        catalog.sort((a, b) => a.name.localeCompare(b.name));
        isSorted = true;
        sortBtn.textContent = "החזר לסדר המקורי";
      } else {
        catalog.sort((a, b) => new Date(b.updatedAt) - new Date(a.updatedAt));
        isSorted = false;
        sortBtn.textContent = "מיין אלפביתי לפי שם";
      }
      groupByGenre();
      renderGroupedCatalog();
    });
  
    // Search filter
    searchInput.addEventListener("input", () => {
  const query = searchInput.value.toLowerCase();

  if (!query) {
    // If search is empty, go back to grouped view
    const newest = [...catalog]
    .sort((a, b) => {
          const dateA = new Date(a.updatedAt);
          const dateB = new Date(b.updatedAt);
          console.log('Comparing:', a.name, dateA, 'vs', b.name, dateB, '=>', dateB - dateA);
          return dateB - dateA;
      })
      .slice(0, 10);
    renderNewest(newest);
    groupByGenre();
    renderGroupedCatalog();
    return;
  }

  // Filter catalog
  const filtered = catalog.filter(
    item =>
      item.name.toLowerCase().includes(query) ||
      item.genre.some(g => g.toLowerCase().includes(query))
  );

  // Render flat list
  renderFlatCatalog(filtered);
});

  </script>  
</body>
</html>
