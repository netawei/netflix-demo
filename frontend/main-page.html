<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>דף ראשי עם לייקים, מיון וחיפוש</title>
  <style>
    .genre-filter {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  justify-content: center;
  margin: 20px 0;
}

.genre-btn {
  padding: 8px 16px;
  border: none;
  border-radius: 20px;
  background: #333;
  color: #fff;
  cursor: pointer;
  font-weight: bold;
  transition: background 0.2s, transform 0.2s;
}

.genre-btn:hover {
  background: #444;
  transform: scale(1.05);
}

.genre-btn.active {
  background: #e50914;
}


    body {
      margin: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #111;
      color: #fff;
    }
    .navbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px 24px;
      font-size: 20px;
      background: #000;
    }
    .navbar .logo {
      font-size: 30px;
      font-weight: bold;
      color: #e50914;
    }
    .navbar ul {
      display: flex;
      list-style: none;
      gap: 20px;
      margin: 0;
      padding: 0;
      align-items: center;
    }
    .navbar li a {
      color: #fff;
      text-decoration: none;
    }
    .navbar li a:hover {
      color: #e50914;
    }
    #logoutBtn {
      padding: 6px 12px;
      font-size: 16px;
      border-radius: 6px;
      border: none;
      cursor: pointer;
      background: #e50914;
      color: #fff;
      transition: background 0.2s;
    }
    #logoutBtn:hover {
      background: #c50e15;
    }
    .content {
      padding: 40px;
      text-align: center;
    }
    .greeting {
      margin-bottom: 20px;
      font-size: 24px;
      font-weight: bold;
    }
    .search-box {
      padding: 10px;
      font-size: 16px;
      border-radius: 6px;
      border: none;
      width: 250px;
      margin-bottom: 20px;
      text-align: right;
    }
    .sort-btn {
      cursor: pointer;
      padding: 10px 20px;
      background: linear-gradient(135deg, #e50914, #b00610);
      border: none;
      color: #fff;
      font-weight: bold;
      border-radius: 6px;
      margin-bottom: 20px;
      transition: transform 0.2s, background 0.3s;
    }
    .sort-btn:hover {
      background: linear-gradient(135deg, #f6121d, #c50e15);
      transform: scale(1.05);
    }
    .catalog {
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
      justify-content: center;
      margin-top: 20px;
    }
    .item {
      background: #222;
      padding: 16px;
      border-radius: 10px;
      width: 200px;
      min-height: 520px;
      text-align: right;
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    .item h3 {
      margin: 8px 0 4px 0;
      font-size: 16px;
      color: #fff;
      font-weight: bold;
      line-height: 1.3;
      min-height: 2.6em;
    }
    .item img {
      width: 100%;
      height: 280px;
      object-fit: cover;
      border-radius: 8px;
      margin-bottom: 8px;
      display: block;
    }
    .item p {
      margin: 4px 0;
      font-size: 14px;
    }
    .item-description {
      font-size: 12px;
      color: #b3b3b3;
      margin: 8px 0;
      line-height: 1.4;
      line-clamp: 3;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
      text-overflow: ellipsis;
      max-height: 3.6em;
    }
    .item-rating {
      display: flex;
      align-items: center;
      gap: 5px;
      margin: 6px 0;
      font-size: 13px;
    }
    .rating-stars {
      color: #fbbf24;
      font-size: 14px;
    }
    .rating-value {
      color: #fff;
      font-weight: bold;
    }
    .rating-label {
      color: #b3b3b3;
      font-size: 12px;
    }
    .item-director {
      font-size: 12px;
      color: #b3b3b3;
      margin: 4px 0;
    }
    .item-director strong {
      color: #fff;
    }
    .item-cast {
      font-size: 11px;
      color: #b3b3b3;
      margin: 4px 0;
      line-height: 1.4;
      line-clamp: 2;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .item-cast strong {
      color: #fff;
    }
    .cast-link {
      color: #f0f0f0;
      text-decoration: underline;
      text-decoration-color: rgba(255, 255, 255, 0.4);
      cursor: pointer;
    }
    .cast-link:hover {
      color: #fbbf24;
      text-decoration-color: #fbbf24;
    }
    .item-genre {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
      margin: 6px 0;
    }
    .genre-tag {
      background: rgba(229, 9, 20, 0.2);
      color: #e50914;
      padding: 2px 8px;
      border-radius: 12px;
      font-size: 10px;
      border: 1px solid rgba(229, 9, 20, 0.3);
    }
    .like-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      padding: 6px 10px;
      border-radius: 6px;
      background: #333;
      color: #fff;
      font-weight: bold;
      border: none;
      transition: background 0.2s, color 0.2s;
      position: relative;
    }
    .like-btn.liked {
      background: #e50914;
      color: #fff;
    }
    .item-watch-block {
      margin-top: auto;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .item-actions {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .item-actions button {
      width: 100%;
    }
    .btn-watch,
    .btn-watch-secondary {
      padding: 10px 12px;
      border-radius: 6px;
      font-size: 14px;
      border: none;
      cursor: pointer;
      font-weight: bold;
      transition: transform 0.2s ease, opacity 0.2s ease;
    }
    .btn-watch {
      background: linear-gradient(135deg, #e50914, #b00610);
      color: #fff;
    }
    .btn-watch:hover {
      transform: scale(1.02);
      opacity: 0.95;
    }
    .btn-watch-secondary {
      background: transparent;
      color: #fff;
      border: 1px solid rgba(255, 255, 255, 0.6);
    }
    .btn-watch-secondary:hover {
      transform: scale(1.02);
      background: rgba(255, 255, 255, 0.1);
    }
    .favorite-btn {
      padding: 10px 12px;
      border-radius: 6px;
      font-size: 14px;
      border: 1px solid rgba(255, 255, 255, 0.4);
      background: transparent;
      color: #fff;
      cursor: pointer;
      transition: transform 0.2s ease, opacity 0.2s ease;
    }
    .favorite-btn:hover {
      transform: scale(1.02);
      opacity: 0.95;
      background: rgba(255, 255, 255, 0.08);
    }
    .favorite-btn.favorited {
      border-color: #fbbf24;
      color: #fbbf24;
      background: rgba(251, 191, 36, 0.12);
    }
    .item-progress-text {
      font-size: 11px;
      color: #b3b3b3;
    }
    .heart {
      display: inline-block;
      transition: transform 0.3s;
      position: relative;
      z-index: 2;
    }
    .heart.animate {
      transform: scale(1.5);
    }
    .particle {
      position: absolute;
      width: 6px;
      height: 6px;
      background: #e50914;
      border-radius: 50%;
      animation: fly 0.6s forwards;
      pointer-events: none;
      z-index: 1;
    }
    @keyframes fly {
      0% { transform: translate(0,0) scale(1); opacity: 1; }
      100% { transform: translate(var(--x), var(--y)) scale(0); opacity: 0; }
    }
  </style>
</head>
<body>
  <header class="navbar">
    <div class="logo">Netflix</div>
    <ul>
      <li><a href="#">בית</a></li>
      <li><a href="#">סדרות</a></li>
      <li><a href="#">סרטים</a></li>
      <li><a href="profiles.html">החלף פרופיל</a></li>
      <li><button id="logoutBtn">התנתקות</button></li>
    </ul>
  </header>

  <main class="content">
    <div class="greeting" id="greeting"></div>
    <input type="text" id="searchInput" class="search-box" placeholder="חפש סרט או סדרה...">
    <br>
    <button class="sort-btn" id="sortBtn">מיין אלפביתי לפי שם</button>
    <div class="catalog" id="favoritesCatalog"></div>
    <div id="genreFilter" class="genre-filter"></div>
    <div class="catalog" id="newestCatalog"></div>
    <div class="catalog" id="catalog"></div>
  </main>



  <script>
    const BACKEND_URL = localStorage.getItem("BackendURL");
    const activeProfile = JSON.parse(localStorage.getItem("activeProfile"));
    if (activeProfile) {
      document.getElementById("greeting").textContent = `שלום, ${activeProfile.name}`;
    } else {
      window.location.href = "profiles.html";
    }
  
    document.getElementById("logoutBtn").addEventListener("click", () => {
      // Logout from backend
      fetch(BACKEND_URL + '/api/users/logout', {
        method: 'GET',
        credentials: 'include'
      }).catch(err => console.error('Logout error:', err));
      
      // Clear all user data from localStorage
      localStorage.removeItem("activeProfile");
      localStorage.removeItem("isLoggedIn");
      localStorage.removeItem("userEmail");
      localStorage.removeItem("userId");
      localStorage.removeItem("userName");
      localStorage.removeItem("userProfiles");
      window.location.href = "index.html";
    });

    const API_BASE_URL = BACKEND_URL + '/api/users';
    const userId = activeProfile?.userId || localStorage.getItem("userId");
    const profileName = activeProfile?.name;
    let likedContentIds = []; // Array of content IDs that are liked by this profile
    let favoriteContentIds = []; // Array of content IDs that are favorited by this profile
    

    const catalogDiv = document.getElementById("catalog");
    const newestDiv = document.getElementById("newestCatalog");
    const favoritesDiv = document.getElementById("favoritesCatalog");
    const searchInput = document.getElementById("searchInput");
    const sortBtn = document.getElementById("sortBtn");
  
    let catalog = [];
    let genres = [];
    let groupedCatalog = {};
    let isSorted = false;
    const storedLikes = JSON.parse(localStorage.getItem("likes")) || {};
    const WATCH_HISTORY_BASE = BACKEND_URL+'/api/watchHistory';
    let watchHistoryMap = {};

    async function loadWatchHistory() {
      if (!userId) {
        watchHistoryMap = {};
        return {};
      }
      try {
        const response = await fetch(`${WATCH_HISTORY_BASE}/user/${userId}`, {
          method: 'GET',
          credentials: 'include'
        });
        if (!response.ok) {
          throw new Error('Failed to load watch history');
        }
        const histories = await response.json();
        const map = {};
        histories.forEach(entry => {
          const contentId = entry.content?._id || entry.content;
          if (contentId) {
            map[String(contentId)] = {
              progress: entry.progress || 0,
              lastWatchedAt: entry.lastWatchedAt || null
            };
          }
        });
        watchHistoryMap = map;
        return map;
      } catch (error) {
        console.error('Error loading watch history:', error);
        watchHistoryMap = {};
        return {};
      }
    }

    async function initCatalog() {
      try {
        const [contentResponse, historyMap] = await Promise.all([
          fetch(BACKEND_URL+ "/api/content").then(res => res.json()),
          loadWatchHistory()
        ]);


        // Load episode progress for all series
        const seriesIds = contentResponse.filter(c => c.type === 'series').map(c => c._id);
        const episodeProgressData = {};
        
        if (userId) {
          await Promise.all(
            seriesIds.map(async (seriesId) => {
              try {
                const response = await fetch(`${WATCH_HISTORY_BASE}/episode-progress/${userId}/${seriesId}`, {
                  method: 'GET',
                  credentials: 'include'
                });
                if (response.ok) {
                  const data = await response.json();
                  episodeProgressData[seriesId] = data;
                }
              } catch (error) {
                console.error(`Error loading progress for series ${seriesId}:`, error);
              }
            })
          );
        }

        catalog = contentResponse.map(content => {
          const timeMs = new Date(content.createdAt).getTime();
          const contentId = String(content._id);
          const history = historyMap[contentId] || {};

                    
          let progress = history.progress || 0;
          let currentEpisodeInfo = null;
          
          // For series, check episode progress
          if (content.type === 'series' && episodeProgressData[content._id]) {
            const seriesProgress = episodeProgressData[content._id];
            if (seriesProgress.currentEpisode) {
              currentEpisodeInfo = seriesProgress.currentEpisode;
              // Find the progress for current episode
              const currentEpProgress = (seriesProgress.episodeProgress || []).find(
                ep => ep.seasonNumber === currentEpisodeInfo.seasonNumber && 
                      ep.episodeNumber === currentEpisodeInfo.episodeNumber
              );
              if (currentEpProgress) {
                progress = currentEpProgress.progress;
              }
            }
          }

          return {
            id: contentId,
            name: content.title,
            type: content.type,
            year: content.releaseYear,
            likes: content.likes || 0,
            img: content.posterUrl,
            genre: content.genre || [],
            director: content.director || '',
            cast: content.cast || [],
            description: content.description || '',
            rating: content.rating || null,
            progress: progress,
            currentEpisode: currentEpisodeInfo,
            lastWatchedAt: history.lastWatchedAt || null,
            createdAt: isNaN(timeMs) ? 0 : timeMs
          };
        });
      
      genres =[...new Set(contentResponse.map(content => content.genre).flat())];
      renderGenreButtons();

      console.log(genres);



        try {
          await loadLikedContent();
        } catch (err) {
          console.error('Error loading liked content:', err);
        }

        try {
          await loadFavoriteContent();
        } catch (err) {
          console.error('Error loading favorite content:', err);
        }

        renderCatalog(catalog);
      } catch (error) {
        console.error('Error initializing catalog:', error);
      }
    }

    initCatalog();

    // Load liked content from backend
    async function loadLikedContent() {
      if (!userId || !profileName) {
        console.warn('No userId or profileName, using localStorage fallback');
        const storedLikes = JSON.parse(localStorage.getItem(`likes_${userId}_${profileName}`)) || {};
        return Object.keys(storedLikes).filter(key => storedLikes[key].liked);
      }

      try {
        const response = await fetch(`${API_BASE_URL}/profiles/liked-content`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
          },
          credentials: 'include',
          body: JSON.stringify({
            userId: userId,
            profileName: profileName
          })
        });

        if (response.ok) {
          const data = await response.json();
          // Ensure all IDs are strings for consistent comparison
          likedContentIds = (data.likedContent || []).map(id => String(id));
          return likedContentIds;
        } else {
          throw new Error('Failed to load liked content');
        }
      } catch (error) {
        console.error('Error loading liked content:', error);
        // Fallback to localStorage
        const storedLikes = JSON.parse(localStorage.getItem(`likes_${userId}_${profileName}`)) || {};
        const fallbackLikes = Object.keys(storedLikes).filter(key => storedLikes[key].liked);
        likedContentIds = fallbackLikes.map(id => String(id));
        return likedContentIds;
      }
    }

    async function loadFavoriteContent() {
      const storageKey = `favorites_${userId || 'guest'}_${profileName || 'default'}`;

      if (!userId || !profileName) {
        const storedFavorites = JSON.parse(localStorage.getItem(storageKey)) || [];
        favoriteContentIds = storedFavorites.map(id => String(id));
        return favoriteContentIds;
      }

      try {
        const response = await fetch(`${API_BASE_URL}/profiles/favorites`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
          },
          credentials: 'include',
          body: JSON.stringify({
            userId: userId,
            profileName: profileName
          })
        });

        if (!response.ok) {
          throw new Error('Failed to load favorite content');
        }

        const data = await response.json();
        favoriteContentIds = (data.favorites || []).map(id => String(id));
        return favoriteContentIds;
      } catch (error) {
        console.error('Error loading favorite content:', error);
        const storedFavorites = JSON.parse(localStorage.getItem(storageKey)) || [];
        favoriteContentIds = storedFavorites.map(id => String(id));
        return favoriteContentIds;
      }
    }

    function formatPlaybackTime(seconds) {
      const totalSeconds = Math.max(0, Math.floor(Number(seconds) || 0));
      const hours = Math.floor(totalSeconds / 3600);
      const minutes = Math.floor((totalSeconds % 3600) / 60);
      const secs = totalSeconds % 60;
      if (hours > 0) {
        return `${hours}:${String(minutes).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
      }
      return `${minutes}:${String(secs).padStart(2, '0')}`;
    }

    function setupWatchButtons(container, item) {

      const seriesBtn = container.querySelector('.btn-watch-series');
      if (seriesBtn) {
        seriesBtn.addEventListener('click', (e) => {
          e.stopPropagation();
          openEpisodesOverlay(item);
        });
      }

      const startBtn = container.querySelector('.btn-start-watch');
      if (startBtn) {
        startBtn.addEventListener('click', (e) => {
          e.stopPropagation();
          startWatch(item, true);
        });
      }
      const continueBtn = container.querySelector('.btn-continue-watch');
      if (continueBtn) {
        continueBtn.addEventListener('click', (e) => {
          e.stopPropagation();
          startWatch(item, false);
        });
      }

      const restartSeriesBtn = container.querySelector('.btn-restart-series');
      if (restartSeriesBtn) {
        restartSeriesBtn.addEventListener('click', (e) => {
          e.stopPropagation();
          // Restart from episode 1 of season 1
          const params = new URLSearchParams({
            contentId: item.id,
            seasonNumber: 1,
            episodeNumber: 1,
            restart: '1'
          });
          window.location.href = `watch.html?${params.toString()}`;
        });
      }
      
      const restartMovieBtn = container.querySelector('.btn-restart-movie');
      if (restartMovieBtn) {
        restartMovieBtn.addEventListener('click', (e) => {
          e.stopPropagation();
          startWatch(item, true);
        });
      }
    }

    function setupFavoriteButton(container, item) {
      const favoriteBtn = container.querySelector('.favorite-btn');
      if (!favoriteBtn) return;

      const itemIdStr = String(item.id);
      const storageKey = `favorites_${userId || 'guest'}_${profileName || 'default'}`;

      const updateButtonState = (favorited) => {
        if (favorited) {
          favoriteBtn.classList.add('favorited');
          favoriteBtn.textContent = '★ במועדפים';
        } else {
          favoriteBtn.classList.remove('favorited');
          favoriteBtn.textContent = '☆ הוסף למועדפים';
        }
      };

      updateButtonState(item.favorited);

      favoriteBtn.addEventListener('click', async (e) => {
        e.stopPropagation();
        favoriteBtn.disabled = true;

        try {
          if (userId && profileName) {
            const response = await fetch(`${API_BASE_URL}/profiles/favorite`, {
              method: 'POST',
              headers: {
                'Content-Type': 'application/json',
              },
              credentials: 'include',
              body: JSON.stringify({
                userId: userId,
                profileName: profileName,
                contentId: itemIdStr
              })
            });

            if (!response.ok) {
              const errorData = await response.json().catch(() => ({ message: 'Unknown error' }));
              throw new Error(errorData.message || 'Failed to toggle favorite');
            }

            const data = await response.json();
            favoriteContentIds = (data.favorites || []).map(id => String(id));
          } else {
            let storedFavorites = JSON.parse(localStorage.getItem(storageKey)) || [];
            storedFavorites = storedFavorites.map(id => String(id));
            if (storedFavorites.includes(itemIdStr)) {
              storedFavorites = storedFavorites.filter(id => id !== itemIdStr);
            } else {
              storedFavorites.push(itemIdStr);
            }
            favoriteContentIds = storedFavorites;
            localStorage.setItem(storageKey, JSON.stringify(storedFavorites));
          }

          item.favorited = favoriteContentIds.includes(itemIdStr);
          favoriteBtn.disabled = false;
          renderCatalog(catalog);
        } catch (error) {
          console.error('Error toggling favorite:', error);
          alert('שגיאה בעדכון מועדפים. נסה שוב.');
          favoriteBtn.disabled = false;
        }
      });
    }

    function setupViewMoreCast(container, item) {
      const viewMoreBtn = container.querySelector('.btn-view-more-cast');
      if (!viewMoreBtn) return;

      viewMoreBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        const params = new URLSearchParams();
        params.append('contentId', item.id);
        if (item.name) {
          params.append('title', item.name);
        }
        window.location.href = `cast-list.html?${params.toString()}`;
      });
    }

    async function startWatch(item, restart = false) {
      if (!userId) {
        alert("אנא התחבר תחילה כדי לצפות בתוכן");
        return;
      }
      const progressToSave = restart ? 0 : (watchHistoryMap[item.id]?.progress || 0);
      try {
        await fetch(`${WATCH_HISTORY_BASE}/progress`, {
          method: 'PUT',
          headers: {
            'Content-Type': 'application/json'
          },
          credentials: 'include',
          body: JSON.stringify({
            user: userId,
            content: item.id,
            progress: progressToSave
          })
        });
        watchHistoryMap[item.id] = {
          progress: progressToSave,
          lastWatchedAt: new Date().toISOString()
        };
      } catch (error) {
        console.error('Error updating watch progress:', error);
      }

      const params = new URLSearchParams({ contentId: item.id });
      if (restart) {
        params.set('restart', '1');
      }
      window.location.href = `watch.html?${params.toString()}`;
    }

    // Helper function to format movie metadata
    function formatMovieMetadata(item) {
      const ratingDisplay = item.rating && item.rating !== -1 
        ? `<div class="item-rating">
             <span class="rating-value">${parseFloat(item.rating).toFixed(1)}</span>
             <span class="rating-stars">⭐</span>
           </div>`
        : '';
      
      const descriptionDisplay = item.description 
        ? `<p class="item-description" title="${item.description}">${item.description}</p>`
        : '';
      
      const directorDisplay = item.director 
        ? `<p class="item-director"><strong>במאי:</strong> ${item.director}</p>`
        : '';
      
      let castDisplay = '';
      if (item.cast && item.cast.length > 0) {
        const visibleActors = item.cast.slice(0, 3).map(actor => {
          const encodedName = encodeURIComponent(actor.trim());
          return `<a class="cast-link" href="https://en.wikipedia.org/wiki/${encodedName}" target="_blank" rel="noopener noreferrer">${actor}</a>`;
        }).join(', ');

        const viewMoreLink = item.cast.length > 3
          ? ` <button class="btn-watch-secondary btn-view-more-cast" data-content="${item.id}" data-title="${encodeURIComponent(item.name)}">עוד...</button>`
          : '';

let filteredResults = [];
let itemsPerPage = 50;
let renderedCount = 0;
let isLoadingMore = false;


function applyFilters() {
  const query = searchInput.value.toLowerCase().trim();

  // Start from the full catalog
  let filtered = [...catalog];

  // Apply genre filter (if any selected)
  if (selectedGenres.size > 0) {
    filtered = filtered.filter(item =>
      item.genre.some(g => selectedGenres.has(g))
    );
  }

  // Apply search filter (if search not empty)
  if (query) {
    filtered = filtered.filter(item =>
      item.name.toLowerCase().includes(query) ||
      item.genre.some(g => g.toLowerCase().includes(query))
    );
  }

  // Save and render the result
  filteredResults = filtered;
  renderedCount = 0;
  catalogDiv.innerHTML = "";
  newestDiv.innerHTML = "";
  window.removeEventListener("scroll", handleScroll);

  const newest = [...filteredResults]
      .sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt))
      .slice(0, 10);
    renderNewest(newest);
  if (filteredResults.length === catalog.length && !query && selectedGenres.size === 0) {
    // Default full view (no filters)
    groupByGenre();
    renderGroupedCatalog();
    filteredResults = [];
    renderedCount = 0;
    return;
  }

  // If results fit in one page — render them all and don't attach scroll
  if (filteredResults.length <= itemsPerPage) {
    renderFlatCatalog(filteredResults);
    // ensure there's no scroll listener
    return;
  }

  // Otherwise render first batch and attach scroll listener
  renderNextBatch();
  window.addEventListener("scroll", handleScroll);
}


let scrollTimeout = null;

function handleScroll() {
  if (isLoadingMore) return;

  const scrollPosition = window.innerHeight + window.scrollY;
  const threshold = document.body.offsetHeight - 300;

  if (scrollPosition >= threshold) {
    isLoadingMore = true;
    window.removeEventListener("scroll", handleScroll);
    renderNextBatch(itemsPerPage);
  }
}


function renderNextBatch(itemsPerPage = 50) {
  if (filteredResults.length === 0) return;

  const total = filteredResults.length;
  let nextBatch = [];

  for (let i = 0; i < itemsPerPage; i++) {
    const index = (renderedCount + i) % total; // wrap around
    nextBatch.push(filteredResults[index]);
  }

  renderedCount = (renderedCount + itemsPerPage) % total;

  // create grid if needed
  let grid = catalogDiv.querySelector(".catalog-grid");
  if (!grid) {
    const title = document.createElement("h2");
    title.textContent = `תוצאות (${filteredResults.length})`;
    title.style.textAlign = "center";
    title.style.marginTop = "40px";
    title.style.color = "#e50914";
    title.style.fontSize = "28px";
    title.style.fontWeight = "bold";
    catalogDiv.appendChild(title);

    grid = document.createElement("div");
    grid.classList.add("catalog-grid");
    grid.style.display = "flex";
    grid.style.flexWrap = "wrap";
    grid.style.gap = "20px";
    grid.style.justifyContent = "flex-start";
    catalogDiv.appendChild(grid);
  }

  // append items
  nextBatch.forEach(item => {
    if (storedLikes[item.id]) {
      item.likes = storedLikes[item.id].likes;
      item.liked = storedLikes[item.id].liked;
    } else item.liked = false;

    const div = document.createElement("div");
    div.classList.add("item");
    div.innerHTML = `
      <img src="${item.img}" alt="${item.name}">
      <h3>${item.name}</h3>
      <p><strong>שנה:</strong> ${item.year}</p>
      <p><strong>לייקים:</strong> <span class="like-count">${item.likes}</span></p>
      <button class="like-btn ${item.liked ? 'liked' : ''}">
        <span class="heart">${item.liked ? '❤️' : '🤍'}</span> לייק
      </button>
    `;

    const btn = div.querySelector(".like-btn");
    const heart = btn.querySelector(".heart");
    const count = div.querySelector(".like-count");

    btn.addEventListener("click", () => {
      item.liked = !item.liked;
      item.likes += item.liked ? 1 : -1;
      btn.classList.toggle("liked", item.liked);
      heart.textContent = item.liked ? "❤️" : "🤍";
      if (item.liked) createParticles(div);
      count.textContent = item.likes;
      storedLikes[item.id] = { likes: item.likes, liked: item.liked };
      localStorage.setItem("likes", JSON.stringify(storedLikes));
    });

    grid.appendChild(div);
  });

  isLoadingMore = false;
  window.addEventListener("scroll", handleScroll);
}

  title.style.fontWeight = "bold";

  catalogDiv.appendChild(title);

  const grid = document.createElement("div");
  grid.classList.add("catalog-grid");
  grid.style.display = "flex";
  grid.style.flexWrap = "wrap";
  grid.style.gap = "20px";
  grid.style.justifyContent = "flex-start";

  list.forEach(item => {
    // Use the liked status from likedContentIds (loaded from database)
    // Only use storedLikes for likes count if needed, but not for liked status
    if (storedLikes[item.id] !== undefined && storedLikes[item.id].likes !== undefined) {
      item.likes = storedLikes[item.id].likes;
    }
    // Ensure liked status is based on database (likedContentIds)
    const itemIdStr = String(item.id);
    item.liked = likedContentIds.some(likedId => String(likedId) === itemIdStr);

    const div = document.createElement("div");
    div.classList.add("item");
    const metadata = formatMovieMetadata(item);
    div.innerHTML = `
      <img src="${item.img}" alt="${item.name}">
      <h3>${item.name}</h3>
      ${metadata.ratingDisplay}
      ${metadata.genreDisplay}
      <p><strong>שנה:</strong> ${item.year}</p>
      ${metadata.directorDisplay}
      ${metadata.castDisplay}
      ${metadata.descriptionDisplay}
      ${metadata.watchSection}
    `;

    grid.appendChild(div);

    const btn = div.querySelector(".like-btn");
    const heart = btn.querySelector(".heart");
    const count = div.querySelector(".like-count");

    btn.addEventListener("click", async () => {
      const wasLiked = item.liked;
      item.liked = !item.liked;
      
      // Update UI immediately for better UX
      if(item.liked){
        item.likes++;
        btn.classList.add("liked");
        heart.textContent = '❤️';
        heart.classList.add("animate");
        createParticles(div);
        likedContentIds.push(item.id);
      } else {
        item.likes--;
        btn.classList.remove("liked");
        heart.textContent = '🤍';
        likedContentIds = likedContentIds.filter(id => id !== item.id);
      }
      count.textContent = item.likes;
      setTimeout(() => heart.classList.remove("animate"), 300);

      // Save to backend
      if (userId && profileName) {
        try {
          const response = await fetch(`${API_BASE_URL}/profiles/like`, {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
            },
            credentials: 'include',
            body: JSON.stringify({
              userId: userId,
              profileName: profileName,
              contentId: String(item.id), // Ensure contentId is a string
              contentGenres: item.genre || []
            })
          });

          if (response.ok) {
            // Update likedContentIds from server response to ensure consistency
            const data = await response.json();
            if (data.likedContent) {
              likedContentIds = data.likedContent.map(id => String(id));
              console.log('Like saved successfully. Updated likedContentIds:', likedContentIds);
            }
          } else {
            // Revert if save failed
            const errorData = await response.json().catch(() => ({ message: 'Unknown error' }));
            item.liked = wasLiked;
            if(wasLiked) {
              item.likes--;
              btn.classList.remove("liked");
              heart.textContent = '🤍';
              likedContentIds = likedContentIds.filter(id => String(id) !== String(item.id));
            } else {
              item.likes++;
              btn.classList.add("liked");
              heart.textContent = '❤️';
              likedContentIds.push(String(item.id));
            }
            count.textContent = item.likes;
            alert("שגיאה בשמירת הלייק. נסה שוב.");
            console.error('Save failed:', errorData);
          }
        } catch (error) {
          console.error('Error saving like:', error);
          // Revert on error
          item.liked = wasLiked;
          if(wasLiked) {
            item.likes--;
            btn.classList.remove("liked");
            heart.textContent = '🤍';
            likedContentIds = likedContentIds.filter(id => id !== item.id);
          } else {
            item.likes++;
            btn.classList.add("liked");
            heart.textContent = '❤️';
            likedContentIds.push(item.id);
          }
          count.textContent = item.likes;
          alert("שגיאה בשמירת הלייק. נסה שוב.");
        }
      } else {
        // Fallback to localStorage if no userId/profileName
        const storedLikes = JSON.parse(localStorage.getItem(`likes_${userId}_${profileName}`)) || {};
        storedLikes[item.id] = { likes: item.likes, liked: item.liked };
        localStorage.setItem(`likes_${userId}_${profileName}`, JSON.stringify(storedLikes));
      }
    });

    setupFavoriteButton(div, item);
    setupViewMoreCast(div, item);
    setupWatchButtons(div, item);
  });

  catalogDiv.appendChild(grid);
}

    function createParticles(container) {
      for (let i = 0; i < 8; i++) {
        const particle = document.createElement("span");
        particle.classList.add("particle");
        const x = Math.random() * 80 - 40 + "px";
        const y = -Math.random() * 60 - 20 + "px";
        particle.style.setProperty("--x", x);
        particle.style.setProperty("--y", y);
        container.appendChild(particle);
        setTimeout(() => container.removeChild(particle), 600);
      }
    }



    sortBtn.addEventListener("click", () => {
      if (!isSorted) {
        catalog.sort((a, b) => a.name.localeCompare(b.name));
        isSorted = true;
        sortBtn.textContent = "החזר לסדר המקורי";
      } else {
        catalog.sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt));
        isSorted = false;
        sortBtn.textContent = "מיין אלפביתי לפי שם";
      }
      groupByGenre();
      renderGroupedCatalog();
    });
  
    // Search filter
    searchInput.addEventListener("input", applyFilters);

  </script>  
</body>
</html>
